
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For My Bee ❤️</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#100609;color:#f5dfc0;
font-family:Georgia,serif;text-align:center;
}
main{
min-height:100vh;padding:55px 20px;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
background:radial-gradient(circle,#4b101d,#100609 75%);
}
.rose{font-size:75px;animation:glow 2s infinite alternate}
h1{color:#e6bd76;font-size:38px;font-weight:normal}
p{line-height:2;font-size:17px}
button{
background:linear-gradient(120deg,#e5bd75,#95652d);
border:0;border-radius:30px;padding:15px 28px;
font-size:16px;color:#190b0b;margin:15px;
}
.card{
display:none;max-width:420px;padding:25px;
border:1px solid #d6aa65;border-radius:18px;
background:#211015;margin-top:25px;
animation:show 1s;
}
.heart{position:fixed;bottom:-30px;animation:up 7s linear forwards}
@keyframes up{to{transform:translateY(-110vh);opacity:0}}
@keyframes glow{to{transform:scale(1.1)}}
@keyframes show{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
footer{color:#c69d64;margin-top:45px;font-size:13px}
</style>
</head>
<body>
<main>
<div class="rose">🌹</div>
<p>TO MY ONE AND ONLY</p>
<h1>For My Bee ❤️</h1>
<p>
မင်းက ကိုယ့်ဘဝရဲ့<br>
အလှပဆုံး အစိတ်အပိုင်းလေးပါ။
</p>
<button onclick="openLove()">Open My Surprise 💌</button>

<div class="card" id="letter">
<h2 style="color:#e6bd76">ငယ်လေးရေ ❤️</h2>
<p>
ကိုယ်မင်းကို အရမ်းချစ်တယ်။<br>
ဘယ်အချိန်ဖြစ်ဖြစ် မင်းဘေးမှာ<br>
ကိုယ်ရှိနေမယ်။ ❤️
<br><br>
မင်းနဲ့အတူ လှပတဲ့အမှတ်တရတွေ<br>
အများကြီး ဖန်တီးသွားချင်တယ်။
<br><br>
Forever Yours 🌹
</p>
</div>

<footer>MADE WITH LOVE · FOREVER ♡</footer>
</main>
<script>
function openLove(){
document.getElementById('letter').style.display='block';

let music = document.getElementById('bgMusic');
music.play();
}
function makeHeart(){
let h=document.createElement('div');
h.className='heart';
h.textContent='❤️';
h.style.left=Math.random()*100+'vw';
h.style.fontSize=(15+Math.random()*20)+'px';
document.body.appendChild(h);
setTimeout(()=>h.remove(),7000);
}
setInterval(makeHeart,600);
</script>
  <audio id="bgMusic" src="song_28s.mp3" loop></audio>
</body>
</html>
